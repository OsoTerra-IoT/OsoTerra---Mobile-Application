name: Build APK

on:
  push:
    branches: [ci/build-apk]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk osoterra-mobile-0.1.0-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: osoterra-mobile-debug-apk
          path: osoterra-mobile-0.1.0-debug.apk

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.2.0-sprint2 --yes --cleanup-tag || true
          gh release create v0.2.0-sprint2 osoterra-mobile-0.1.0-debug.apk \
            --target "${{ github.sha }}" --prerelease \
            --title "OsoTerra Mobile v0.2.0 (Sprint 2) - debug APK" \
            --notes "APK debug de la Mobile App (com.osoterra.mobile) para Firebase App Distribution. Consume el RESTful API desplegado en Railway."
